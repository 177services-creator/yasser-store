    <style>
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup:target {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .popup img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 65vh;
            margin: 0;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .popup:target img {
            transform: scale(1);
        }

        .order {
            display: flex;
            flex-direction: column-reverse;   /* l'kteba foq, l'icône ta7t */
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 260px;
            max-width: 90%;
            padding: 14px 0;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
        }

        .order svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        .close {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #fff;
            font-size: 28px;
            text-decoration: none;
        }
        .back {
            
            display: block;
            margin:40px  ;
            width: fit-content;
            padding: 12px 28px;
            color: #d4af37;
            background-color: #0b1020;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-left: 50px;

        }
        .back:hover {
            color: #0b1020;
            background-color: #d4af37;
        }
        body{
            background-color: black;
            color:aliceblue;
        }
        h1{
            text-align: center;
            color: aliceblue;
            margin-right: 50px;
        }
        .articles{
            display: flex;
            flex-wrap: wrap;
            gap: 30px;

        }
        .articles figure{
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        .articles img {
            height: 250px;
            display: block;
            margin-left: 30px;
        }
        .articles figcaption{
            margin-top: 8px;
            font-weight:bolder;
            text-align: center;
            font-size: medium;
        }
        .image{
            top: 0px;
            left: 16px;
            width: 60px;
            height: auto;      
            position:absolute ;
        }
        .photo{
            top: 0px;
            right: 16px;
            width: 60px;
            height: auto;      
            position:absolute ;
        }
        @media (max-width: 600px) {
            .logo {
                 width: 80%;
                 max-width: 300px;
                 margin: 80px auto 20px;   
            }
            .articles{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 0px;
                margin-top: 20px;
            }

            h1 {
                font-size: 22px;
                text-align: center;
                padding: 0 10px;          
                margin-top: 30px;
                margin-left: 20px;
            }

            .articles figure {
                margin: 0;
                width: auto;
            }

            .articles img {
                width: 100%;
                height: auto;
                margin: 0;
            }
            .articles figcaption ul{
                list-style: none;
                padding: 0;
                margin: 8px 0;
                font-size: 13px;
            }
        }
    </style>
