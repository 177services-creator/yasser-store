<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasser store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f4f4f4;font-family:Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
header img{width:56px;height:auto}
h1{font-size:22px;text-align:center;margin:0;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:16px;max-width:1100px;margin:auto}
.card{cursor:pointer;text-align:center;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.card ul{list-style:none;padding:0;margin:8px 0;font-size:14px;font-weight:bold}
.tag{position:absolute;top:8px;left:8px;background:#b3261e;color:#fff;font-size:12px;font-weight:bold;padding:4px 8px;border-radius:4px}
.back{display:block;width:fit-content;margin:30px auto;padding:12px 28px;color:#d4af37;background:#0b1020;font-weight:bold;text-decoration:none;border-radius:8px}
.msg{text-align:center;padding:40px;color:#aaa}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.94);overflow-y:auto;display:none;z-index:50}
#modal.on{display:block}
.box{max-width:480px;margin:auto;padding:16px 16px 40px}
.x{position:fixed;top:10px;right:14px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;z-index:60}
.sl-wrap{position:relative}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0}
.sl::-webkit-scrollbar{display:none}
.sl img{flex:0 0 100%;scroll-snap-align:center;max-height:58vh;object-fit:contain;background:#000}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.ar.l{left:4px}.ar.r{right:4px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.row b{flex:1 1 100%}
select,input,textarea{background:#111;color:#fff;border:1px solid #444;border-radius:6px;padding:11px;font-size:16px;width:100%}
.row select{flex:1}
label{display:block;margin-top:12px;font-size:14px;color:#ccc}
.total{font-size:20px;font-weight:bold;color:#d4af37;margin:16px 0 4px}
button.go{width:100%;margin-top:16px;padding:15px;background:#d4af37;color:#0b1020;font-weight:bold;font-size:17px;border:0;border-radius:8px;cursor:pointer}
button.go:disabled{opacity:.5}
.ok{text-align:center;padding:50px 10px;font-size:18px}
.err{color:#ff8a80;margin-top:10px;font-size:14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #d4af37}
</style>
</head>
<body>
<header><img src="logo.jpeg" alt=""><h1>Welcome to your store</h1><img src="logo.jpeg" alt=""></header>
<div id="list" class="grid"><p class="msg">Chargement...</p></div>
<a href="index.html" class="back">Back to accueil</a>
<div id="modal"><button class="x" onclick="closeM()" aria-label="Fermer">✕</button><div class="box" id="mbox"></div></div>
<script>
const sb=supabase.createClient('https://cmnqbvgzmyiqibozaoea.supabase.co','sb_publishable_ui8rtLgQWnMzM_byFlw3KQ_uyamkvAO');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let outfits=[],cur=null;

async function load(){
  const {data,error}=await sb.from('outfits').select('*').order('position').order('id');
  if(error){$('#list').innerHTML='<p class="msg">Erreur de chargement. Réessayez.</p>';return}
  outfits=data;
  if(!data.length){$('#list').innerHTML='<p class="msg">Bientôt de nouveaux articles.</p>';return}
  $('#list').innerHTML=data.map((o,i)=>`<div class="card" onclick="openM(${i})">
    ${o.in_stock?'':'<span class="tag">Rupture</span>'}
    <img src="${esc((o.images||[])[0])}" alt="${esc(o.title)}" loading="lazy">
    <ul>${(o.items||[]).map(t=>`<li>${esc(t.name)}: ${esc(t.price)}dh</li>`).join('')}</ul></div>`).join('');
}

function openM(i){
  cur=outfits[i];
  const imgs=cur.images||[];
  const many=imgs.length>1;
  $('#mbox').innerHTML=`
  <div class="sl-wrap"><div class="sl" id="sl">${imgs.map(u=>`<img src="${esc(u)}" alt="${esc(cur.title)}">`).join('')}</div>
  ${many?'<button class="ar l" onclick="sl(-1)" aria-label="Précédent">‹</button><button class="ar r" onclick="sl(1)" aria-label="Suivant">›</button>':''}</div>
  <form id="of" onsubmit="send(event)">
  ${(cur.items||[]).map((t,k)=>`<div class="row"><b>${esc(t.name)} — ${esc(t.price)}dh</b>
    ${(t.sizes||[]).length?`<select name="s${k}" required><option value="">Taille</option>${t.sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}
    ${(t.colors||[]).length?`<select name="c${k}" required><option value="">Couleur</option>${t.colors.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}</div>`).join('')}
  <div class="total">Total: ${(cur.items||[]).reduce((a,t)=>a+(+t.price||0),0)}dh</div>
  ${cur.in_stock?`
  <label>Nom complet<input name="n" required></label>
  <label>Téléphone<input name="p" type="tel" required></label>
  <label>Ville<input name="v" required></label>
  <label>Adresse<textarea name="a" rows="2" required></textarea></label>
  <label>Remarque (facultatif)<input name="r"></label>
  <button class="go" id="gb">Commander</button><div class="err" id="er"></div>`
  :'<p class="err">Cet article est en rupture de stock.</p>'}
  </form>`;
  $('#modal').classList.add('on');document.body.style.overflow='hidden';$('#modal').scrollTop=0;
}
function sl(d){const e=$('#sl');e.scrollBy({left:d*e.clientWidth,behavior:'smooth'})}
function closeM(){$('#modal').classList.remove('on');document.body.style.overflow=''}

async function send(e){
  e.preventDefault();
  const f=e.target,b=$('#gb');b.disabled=true;$('#er').textContent='';
  const sel=(cur.items||[]).map((t,k)=>({name:t.name,price:+t.price||0,size:f['s'+k]?.value||null,color:f['c'+k]?.value||null}));
  const {error}=await sb.from('orders').insert({
    outfit_id:cur.id,outfit_title:cur.title,selections:sel,
    total:sel.reduce((a,t)=>a+t.price,0),
    customer_name:f.n.value.trim(),phone:f.p.value.trim(),city:f.v.value.trim(),
    address:f.a.value.trim(),notes:f.r.value.trim()||null});
  if(error){b.disabled=false;$('#er').textContent='Erreur, réessayez ou contactez-nous.';return}
  $('#mbox').innerHTML='<div class="ok">✅ Commande envoyée !<br><br>Nous vous contactons très bientôt pour confirmer la livraison.</div><button class="go" onclick="closeM()">Fermer</button>';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
load();
</script>
</body>
</html>
