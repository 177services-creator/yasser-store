    <style>
        .text{ 
            color: #e7e8eb;
            text-decoration: none;
        }
        .text:hover{
            color: #d4af37;
            text-decoration: underline;
        }
        .contact-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .icon-btn {
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            margin: 0 !important;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #333;
            color: #d4af37 !important;
            text-decoration: none;
            transition: all 0.2s;
        }
        .icon-btn svg {
            display: block !important;
            width: 26px !important;
            height: 26px !important;
            fill: #d4af37 !important;
            color: #d4af37 !important;
        }
        .icon-btn svg path {
            fill: #d4af37 !important;
        }
        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold) !important;
            transform: translateY(-2px);
        }
        p{
            color: rgb(248, 247, 247);
            font-size: larger;
            font-weight: bolder;
        }
        .btn {
            display: inline-block;
           
            margin-top: 30px;
            padding: 18px 60px;
            font-size: 1.2rem;
            color: #0b1020;
            background-color: #d4af37;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
        }
        .btn:hover {
            color: #d4af37;
            background-color: #0b1020;
        }
        body{
            background :rgb(0, 0, 0);
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100%;
            margin: 0;
            background-attachment: fixed;
        }
        body {
            text-align: center;
        }
        .logo {
            display: block;
            margin: 20px auto;
            width: 400px;
            height: auto;
        }
        .sociale {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 35px !important;
            width: 100%;
            margin: 20px auto;
        }
        .social-icon {
            width: 60px !important;
            height: 60px !important;
            flex: 0 0 60px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            border: 1px solid #292929;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-icon svg {
            width: 22px !important;
            height: 22px !important;
            display: block !important;
        }
        .social-icon:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }
        .social-icon.instagram:hover {
            box-shadow: 0 0 12px #C13584;
        }
       .social-icon.tiktok:hover {
            box-shadow: 0 0 12px #25F4EE;
        }
        .social-icon.instagram{
            margin-left: 30px;
        }
        .social-icon.tiktok{
            margin-right: 15px;
        }
        .separator{
            border: none;
            height: 1px;
            background-color:#d4af37;
            width: 60%;
            margin: 60px auto;
        }
        footer{
            color:antiquewhite;
            margin-top: 48px;
            text-align: left;
            font-size: 1rem;
            margin-left: 40px;
            margin-bottom: 40px;
        }
        @media (max-width: 600px) {
            .logo {
                 width: 80%;
                 max-width: 300px;
                 margin: 80px auto 20px;   
            }

            h1 {
                font-size: 22px;
                text-align: center;
                padding: 0 70px;          
            }

            .articles figure {
                margin: 30px auto;
                text-align: center;
            }

            .articles img {
                width: 90%;
                max-width: 400px;
                margin: 0 auto;
                display: block;
            }
        }
    </style>
</html>
